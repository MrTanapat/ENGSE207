<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Client Server</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); padding: 40px 20px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Header & Status */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }

        /* Form Card */
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; outline: none; }
        button { cursor: pointer; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 15px; }
        .btn-add:hover { background: #1d4ed8; }
        .btn-delete { background: #fee2e2; color: var(--danger); font-size: 0.8em; }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #f1f5f9; text-align: left; padding: 15px; font-size: 0.9em; color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .category-tag { background: #eff6ff; color: #3b82f6; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>📦 Product System</h1>
            <p style="color: #64748b;">Client-Server Architecture (Bonus Exam)</p>
        </div>
        <div id="apiStatus" class="status-badge offline">Checking Server...</div>
    </div>

    <div class="card">
        <h3>➕ เพิ่มสินค้าใหม่</h3>
        <div class="form-grid">
            <input type="text" id="pName" placeholder="ชื่อสินค้า (เช่น iPhone 15)">
            <input type="number" id="pPrice" placeholder="ราคา">
            <input type="number" id="pStock" placeholder="จำนวนสต็อก">
            <select id="pCategory">
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Food">Food</option>
                <option value="Books">Books</option>
                <option value="Toys">Toys</option>
            </select>
        </div>
        <button class="btn-add" onclick="handleAddProduct()">บันทึกข้อมูลสินค้า</button>
    </div>

    <div class="card" style="padding: 0;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>สินค้า</th>
                    <th>ราคา</th>
                    <th>สต็อก</th>
                    <th>หมวดหมู่</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="productBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // 🚨 แก้ไขเป็น IP ของ VM คุณที่เช็คได้จาก ip addr
    const API_URL = 'http://192.168.1.6:3000/api/products'; 

    // 1. ฟังก์ชันดึงข้อมูลทั้งหมด (GET)
    async function loadProducts() {
        const statusBadge = document.getElementById('apiStatus');
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            statusBadge.innerText = "Server Online: " + API_URL;
            statusBadge.className = "status-badge online";
            
            renderTable(data.products);
        } catch (error) {
            statusBadge.innerText = "Server Offline (Check IP/CORS)";
            statusBadge.className = "status-badge offline";
            console.error("Fetch Error:", error);
        }
    }

    // 2. ฟังก์ชันเพิ่มสินค้า (POST)
    async function handleAddProduct() {
        const product = {
            name: document.getElementById('pName').value,
            price: parseFloat(document.getElementById('pPrice').value),
            stock: parseInt(document.getElementById('pStock').value),
            category: document.getElementById('pCategory').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            });

            const result = await response.json();
            if (response.ok) {
                alert("✅ เพิ่มสินค้าสำเร็จ!");
                loadProducts(); // โหลดตารางใหม่
            } else {
                alert("❌ Error: " + result.error);
            }
        } catch (error) {
            alert("❌ ไม่สามารถติดต่อ Server ได้");
        }
    }

    // 3. ฟังก์ชันลบสินค้า (DELETE)
    async function deleteProduct(id) {
        if (!confirm("ยืนยันการลบสินค้านี้?")) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            const result = await response.json();
            
            if (response.ok) {
                loadProducts();
            } else {
                // จะแจ้ง Error ถ้า stock > 0 ตาม Business Rule
                alert("❌ " + result.error); 
            }
        } catch (error) {
            alert("❌ ไม่สามารถติดต่อ Server ได้");
        }
    }

    // 4. แสดงผลลงในตาราง
    function renderTable(products) {
        const tbody = document.getElementById('productBody');
        tbody.innerHTML = products.map(p => `
            <tr>
                <td>#${p.id}</td>
                <td><b>${p.name}</b></td>
                <td>${p.price.toLocaleString()} ฿</td>
                <td>${p.stock}</td>
                <td><span class="category-tag">${p.category}</span></td>
                <td>
                    <button class="btn-delete" onclick="deleteProduct(${p.id})">ลบ</button>
                </td>
            </tr>
        `).join('');
    }

    // เริ่มต้นทำงาน
    loadProducts();
</script>

</body>
</html>
